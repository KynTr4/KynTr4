<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Miraç Cevahiroğlu — software developer, local-first AI</title>
  <desc id="desc">Neon terminal style banner: name, role, and a small terminal window with a blinking cursor.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B1F3B" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="#05060F"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="400" fill="url(#glowV)"/>
  <circle cx="1180" cy="330" r="430" fill="url(#glowC)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#topbar)"/>

  <!-- status pill -->
  <rect x="80" y="64" width="272" height="32" rx="16" fill="#0A0D1C" stroke="#22D3EE" stroke-opacity="0.45"/>
  <circle cx="100" cy="80" r="4" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="114" y="85" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="2.2" fill="#7DD3FC">LOCAL-FIRST AI · ISTANBUL</text>

  <!-- name -->
  <text x="80" y="180" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#F4F6FF">Miraç Cevahiroğlu</text>
  <rect x="80" y="198" width="64" height="4" rx="2" fill="url(#accent)"/>

  <!-- role -->
  <text x="80" y="236" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" fill="#A9B2D6">software developer · local-first AI</text>

  <!-- tagline -->
  <text x="80" y="272" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#6E78A0">$ ship fast · test early · iterate forever</text>
  <rect x="420" y="260" width="9" height="15" fill="#22D3EE">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal -->
  <circle cx="1196" cy="62" r="150" fill="none" stroke="#A855F7" stroke-opacity="0.12" stroke-dasharray="3 9"/>
  <rect x="784" y="70" width="416" height="200" rx="12" fill="#0A0D1C" stroke="#232849"/>
  <circle cx="806" cy="87" r="5" fill="#FF5F57" opacity="0.85"/>
  <circle cx="826" cy="87" r="5" fill="#FEBC2E" opacity="0.85"/>
  <circle cx="846" cy="87" r="5" fill="#28C840" opacity="0.85"/>
  <text x="1184" y="91" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6B7499">kyntr4@local — zsh</text>
  <line x1="784" y1="104" x2="1200" y2="104" stroke="#232849"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5">
    <text x="806" y="137" fill="#22D3EE">$ vibe --ship</text>
    <text x="806" y="163" fill="#8AE6C0">✓ local models online</text>
    <text x="806" y="189" fill="#8AE6C0">✓ pipeline green · sqlite ok</text>
    <text x="806" y="215" fill="#C4B5FD">$ comfyui run scene_pipeline</text>
    <text x="806" y="241" fill="#E6E9FF">▍ building the next thing</text>
  </g>
</svg>
