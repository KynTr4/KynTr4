<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Miraç Cevahiroğlu — software developer, local-first AI</title>
  <desc id="desc">Light banner: name, role, and a terminal window with a blinking cursor.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ECEEF8" stroke-width="1" opacity="0.9"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="#FFFFFF"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="400" fill="url(#glowV)"/>
  <circle cx="1180" cy="330" r="430" fill="url(#glowC)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#topbar)"/>

  <rect x="80" y="64" width="272" height="32" rx="16" fill="#F7F8FD" stroke="#0891B2" stroke-opacity="0.35"/>
  <circle cx="100" cy="80" r="4" fill="#0891B2">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="114" y="85" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="2.2" fill="#0E7490">LOCAL-FIRST AI · ISTANBUL</text>

  <text x="80" y="180" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#0B1020">Miraç Cevahiroğlu</text>
  <rect x="80" y="198" width="64" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="236" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" fill="#4C5470">software developer · local-first AI</text>

  <text x="80" y="272" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#7A8199">$ ship fast · test early · iterate forever</text>
  <rect x="420" y="260" width="9" height="15" fill="#0891B2">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <circle cx="1196" cy="62" r="150" fill="none" stroke="#7C3AED" stroke-opacity="0.12" stroke-dasharray="3 9"/>
  <rect x="784" y="70" width="416" height="200" rx="12" fill="#F7F8FD" stroke="#E1E4F2"/>
  <circle cx="806" cy="87" r="5" fill="#FF5F57"/>
  <circle cx="826" cy="87" r="5" fill="#FEBC2E"/>
  <circle cx="846" cy="87" r="5" fill="#28C840"/>
  <text x="1184" y="91" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#8A90A8">kyntr4@local — zsh</text>
  <line x1="784" y1="104" x2="1200" y2="104" stroke="#E7E9F5"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5">
    <text x="806" y="137" fill="#0E7490">$ vibe --ship</text>
    <text x="806" y="163" fill="#0F766E">✓ local models online</text>
    <text x="806" y="189" fill="#0F766E">✓ pipeline green · sqlite ok</text>
    <text x="806" y="215" fill="#6D28D9">$ comfyui run scene_pipeline</text>
    <text x="806" y="241" fill="#1F2440">▍ building the next thing</text>
  </g>
</svg>
